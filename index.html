<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workflow experience</title>
  <meta name="description" content="Principles, rules and patterns for designing the experience of workflows in which the work is automated.">
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/bundle.css">
  <link rel="stylesheet" href="/site.css">
  <script>
    try {
      var t = localStorage.getItem("wx-theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
</head>
<body class="pd-page">
  <a class="skip" href="#main">Skip to content</a>

  <header class="pd-topbar site-topbar">
    <button class="pd-btn pd-btn--tertiary menu-btn" id="menu-btn" type="button" aria-expanded="false" aria-controls="sidenav">Menu</button>
    <a class="pd-logo" href="/" data-link>Workflow experience</a>
    <div class="pd-topbar-actions">
      <button class="pd-btn pd-btn--tertiary" id="theme-btn" type="button">Dark mode</button>
    </div>
  </header>

  <div class="scrim" id="scrim" hidden></div>

  <nav class="pd-sidenav site-sidenav" id="sidenav" aria-label="Design system">
    <div class="site-search">
      <label class="pd-visually-hidden" for="nav-search">Filter pages</label>
      <input class="pd-input" id="nav-search" type="search" placeholder="Filter pages" autocomplete="off">
    </div>
    <div id="nav-tree"></div>
  </nav>

  <div class="site-layout">
    <main class="site-main" id="main" tabindex="-1">
      <article class="page" id="page"></article>
      <aside class="toc" id="toc" aria-label="On this page" hidden></aside>
    </main>
  </div>

  <script src="/nav.js"></script>
  <script src="/app.js"></script>
</body>
</html>
